name: Java CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: ['.', 'workshops/workshop-01', 'workshops/workshop-02', 'workshops/workshop-03', 'workshops/workshop-04']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and test
        run: mvn --batch-mode --file ${{ matrix.project }}/pom.xml verify
